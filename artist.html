<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiTunes — Artista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body data-page="artist">
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main">
        <header class="topbar">
          <div class="d-flex gap-2">
            <button class="nav-btn" id="btn-back" aria-label="Indietro"><i class="bi bi-chevron-left"></i></button>
            <button class="nav-btn" id="btn-forward" aria-label="Avanti"><i class="bi bi-chevron-right"></i></button>
          </div>
          <div class="user-pill">Studente Epicode</div>
        </header>

        <section class="page">
          <div class="hero" id="artist-hero"></div>
          <div class="hero-actions" id="artist-actions"></div>

          <h2 class="section-title">Popolari</h2>
          <div id="top-tracks"></div>

          <section class="section" id="artist-albums" hidden>
            <h2 class="section-title">Discografia</h2>
            <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-4 row-cols-xxl-5 g-3" id="artist-albums-grid"></div>
          </section>
        </section>
      </main>

      <footer class="player" id="player"></footer>
    </div>

    <audio id="audio-element" preload="none"></audio>

    <script src="assets/js/common.js" defer></script>
    <script src="assets/js/artist.js" defer></script>
  </body>
</html>
