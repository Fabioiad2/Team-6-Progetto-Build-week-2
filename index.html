<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiTunes — Home</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

    <link rel="stylesheet" href="assets/css/app.css" />
    
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <!-- Riempi via JS in common.js -->
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-nav">
            <button class="nav-btn" aria-label="Indietro">‹</button>
            <button class="nav-btn" aria-label="Avanti">›</button>
          </div>
          <div class="user-pill">Studente Epicode</div>
        </header>

        <section class="home">
          <!--
            SEZIONI DA COSTRUIRE (vedi js/home.js):
            - "Riprodotti di recente" (da localStorage history)
            - "I tuoi preferiti" (da localStorage favourites)
            
            - "Suggerimenti pop"
            - "Suggerimenti rock"
            - "Suggerimenti italian pop"
            Ogni sezione è un <section class="row"> con titolo h2 e una griglia di .card.
          -->
              <div class="row g-3" id="popRow">
                <h2>Suggerimenti pop</h2>
              </div>
        </section>
      </main>

      <footer class="player">
        <!-- Riempi via JS in common.js -->
      </footer>
    </div>

    <audio id="audio-element"></audio>

    <!-- <script src="js/common.js"></script> -->
    <script src="assets/js/index.js"></script>
    
  </body>
</html>
