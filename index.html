<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EpiTunes — Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="stylesheet" href="assets/css/player.css" />
  <script defer src="assets/js/sidebar.js"></script>

</head>

<body data-page="home">
  <div class="app app-with-sidebar">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-nav d-flex gap-2">
          <button type="button" class="nav-btn" id="btn-back" aria-label="Indietro">‹</button>
          <button type="button" class="nav-btn" id="btn-forward" aria-label="Avanti">›</button>
        </div>
        <div class="user-pill">Studente Epicode</div>
      </header>

      <section class="home" id="home-sections">
        <section class="row" id="row-recent">
          <h2>Riprodotti di recente</h2>
          <!-- <div> class="grid" id="<grid-recent></grid-recent> </div> -->
          <div class="row g-3" id="popRow">
            <h2>Suggerimenti pop</h2>
          </div>

          <div class="row g-3" id="rockRow">
            <h2>Suggerimenti rock</h2>
          </div>

          <div class="row g-3" id="hitsRow">
            <h2>Suggerimenti hits</h2>
          </div>

          <h2>Ultimi brani ascoltati</h2>
          <div class="row g-3" id="historyRow">
          </div>

        </section>
    </main>

    <footer class="player" id="player"></footer>
  </div>

  <audio id="audio-element"></audio>


   <div class="modal" id="detailModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true" data-bs-theme="dark">
      <div class="modal-dialog modal-fullscreen">
        <div class="modal-content bg-black" style="background-image: radial-gradient(ellipse 85% 28rem at 12% 0, rgba(247, 216, 0, .16), transparent);">
          <div class="modal-header border-0 px-0 py-3">
            <div class="container d-flex justify-content-end px-4 px-md-5">
              <button type="button" class="btn btn-outline-light rounded-pill d-inline-flex align-items-center gap-2 px-3" data-bs-dismiss="modal">
                <span class="fs-5 lh-1" aria-hidden="true">&times;</span>
                Chiudi
              </button>
            </div>
          </div>
          <div class="modal-body p-0">
            <div class="container px-4 px-md-5 pb-5">
              <div class="d-flex flex-column flex-sm-row align-items-start align-items-sm-end gap-4 border-bottom border-light border-opacity-10 pt-2 pb-4 pb-md-5">
                <img id="modalImage" class="img-fluid rounded-4 shadow-lg flex-shrink-0" width="144" height="144" alt="" hidden>
                <div class="text-break">
                  <h1 class="modal-title display-5 fw-bold lh-1 text-white" id="modalTitle">Dettaglio</h1>
                  <p id="modalArtistType" class="text-body-secondary fs-5 mt-2 mb-0" hidden></p>
                  <p id="modalGenre" class="rounded-pill bg-warning bg-opacity-10 text-warning small fw-semibold mt-3 mb-0 px-3 py-1" style="width: fit-content;" hidden></p>
                </div>
              </div>

              <div class="pt-4">
                <p id="modalStatus" class="text-body-secondary mb-0" role="status"></p>
                <section id="modalTrackSection" aria-labelledby="modalTrackHeading" hidden>
                  <h2 class="h4 fw-bold mb-3" id="modalTrackHeading">Brani</h2>
                  <ol id="modalTracks" class="list-group list-group-numbered list-group-flush rounded-4 overflow-hidden border border-light border-opacity-10 text-break" style="--bs-list-group-bg: #121212; --bs-list-group-border-color: rgba(255, 255, 255, .1); --bs-list-group-item-padding-x: 1.25rem; --bs-list-group-item-padding-y: .9rem;"></ol>
                </section>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  <!-- <script src="js/common.js"></script> -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  <script src="assets/js/index.js"></script>
  <script src="assets/js/player.js"></script>
  <!-- <script defer src="assets/js/search.js"></script> -->

</body>

</html>
