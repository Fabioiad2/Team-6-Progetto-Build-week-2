<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EpiTunes — Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>

<body data-page="home">
  <div class="app app-with-sidebar">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-nav d-flex gap-2">
          <button type="button" class="nav-btn" id="btn-back" aria-label="Indietro">‹</button>
          <button type="button" class="nav-btn" id="btn-forward" aria-label="Avanti">›</button>
        </div>
        <div class="user-pill">Studente Epicode</div>
      </header>

      <section class="home page" id="home-sections">
        <section id="row-recent">
          <h2 class="section-title mt-4">Suggerimenti pop</h2>
          <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-4 row-cols-xxl-5 g-3" id="popRow"></div>

          <h2 class="section-title mt-4">Suggerimenti rock</h2>
          <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-4 row-cols-xxl-5 g-3" id="rockRow"></div>

          <h2 class="section-title mt-4">Suggerimenti hits</h2>
          <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-4 row-cols-xxl-5 g-3" id="hitsRow"></div>

          <h2 class="section-title mt-4">Ultimi brani ascoltati</h2>
          <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-4 row-cols-xxl-5 g-3" id="historyRow"></div>
        </section>
      </section>
    </main>

    <footer class="player" id="player"></footer>
  </div>

  <audio id="audio-element"></audio>

  <div class="modal fade" id="detailModal" data-bs-backdrop="false" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true" data-bs-theme="dark">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content modal-detail">
        <div class="modal-header border-0 px-0 py-3">
          <div class="container d-flex justify-content-end px-4 px-md-5">
            <button type="button" class="btn btn-outline-light rounded-pill d-inline-flex align-items-center gap-2 px-3 btn-modal-close" data-bs-dismiss="modal">
              <i class="bi bi-x-lg" aria-hidden="true"></i>
              Chiudi
            </button>
          </div>
        </div>
        <div class="modal-body p-0">
          <div class="container px-4 px-md-5 pb-5">
            <div class="modal-hero d-flex flex-column flex-sm-row align-items-start align-items-sm-end gap-4 pt-2 pb-4 pb-md-5">
              <img id="modalImage" class="flex-shrink-0" width="144" height="144" alt="" hidden>
              <div class="text-break">
                <h1 class="modal-title" id="modalTitle">Dettaglio</h1>
                <p id="modalArtistType" class="mb-0" hidden></p>
                <p id="modalGenre" class="mb-0" hidden></p>
                <div id="modalAlbumDetails" hidden>
                  <p id="releaseDate"></p>
                  <p id="trackCount"></p>
                  <p id="AlbumDuration"></p>
                </div>
              </div>
            </div>

            <div class="pt-4">
              <p id="modalStatus" class="text-body-secondary mb-0" role="status"></p>
              <section id="modalTrackSection" aria-labelledby="modalTrackHeading" hidden>
                <h2 class="h4 fw-bold mb-3" id="modalTrackHeading">Brani</h2>
                <ol id="modalTracks" class="list-group list-group-numbered list-group-flush tracklist text-break"></ol>
              </section>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Template della sidebar: sidebar.js lo clona con cloneNode(true)-->
  <template id="sidebar-template">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">♫</span>
      <span class="brand-text">EpiTunes</span>
    </div>
    <nav class="sidebar-nav" aria-label="Navigazione principale">
      <a href="index.html" data-page="home" aria-label="Home">
        <i class="bi bi-house-door-fill" aria-hidden="true"></i>
        <span>Home</span>
      </a>
      <a href="search/search.html" data-page="search" aria-label="Cerca">
        <i class="bi bi-search" aria-hidden="true"></i>
        <span>Cerca</span>
      </a>
    </nav>
    <h2 class="sidebar-section-title" id="favorites-title">I tuoi preferiti</h2>
    <ul class="sidebar-list" aria-labelledby="favorites-title"></ul>
  </template>

  <!-- Template di una voce dei preferiti -->
  <template id="sidebar-item-template">
    <li>
      <button type="button" class="sidebar-fav">
        <i class="bi bi-heart-fill" aria-hidden="true"></i>
        <span class="sidebar-fav-title"></span>
      </button>
    </li>
  </template>

  <!-- <script src="js/common.js"></script> -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  <script src="assets/js/components/player.js"></script>
  <script src="assets/js/utilities/music-library.js"></script>
  <script src="assets/js/components/sidebar.js"></script>
  <script src="assets/js/components/detail-modal.js"></script>
  <script src="assets/js/components/media-card.js"></script>
  <script src="assets/js/pages/index.js"></script>
  <!-- <script src="assets/js/pages/search.js"></script> -->
  <!-- <script defer src="assets/js/search.js"></script> -->

</body>

</html>
