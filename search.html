<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiTunes — Cerca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body data-page="search">
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main">
        <header class="topbar">
          <div class="d-flex gap-2">
            <button class="nav-btn" id="btn-back" aria-label="Indietro"><i class="bi bi-chevron-left"></i></button>
            <button class="nav-btn" id="btn-forward" aria-label="Avanti"><i class="bi bi-chevron-right"></i></button>
          </div>
          <div class="user-pill">Studente Epicode</div>
        </header>

        <section class="page">
          <input
            type="search"
            id="search-input"
            class="form-control form-control-lg rounded-pill search-input mt-2 mb-3"
            data-bs-theme="light"
            placeholder="Cerca un brano, un album, un artista..."
            autocomplete="off"
          />

          <div id="search-status"></div>

          <section class="section" id="row-tracks" hidden>
            <h2 class="section-title">Brani</h2>
            <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-4 row-cols-xxl-5 g-3" id="grid-tracks"></div>
          </section>
          <section class="section" id="row-albums" hidden>
            <h2 class="section-title">Album</h2>
            <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-4 row-cols-xxl-5 g-3" id="grid-albums"></div>
          </section>
          <section class="section" id="row-artists" hidden>
            <h2 class="section-title">Artisti</h2>
            <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-4 row-cols-xxl-5 g-3" id="grid-artists"></div>
          </section>
        </section>
      </main>

      <footer class="player" id="player"></footer>
    </div>

    <audio id="audio-element" preload="none"></audio>

    <script src="assets/js/common.js" defer></script>
    <script src="assets/js/search.js" defer></script>
  </body>
</html>
